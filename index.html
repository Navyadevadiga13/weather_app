<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
       body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: url('weather.jpeg') no-repeat center center/cover;
    background-size: cover;
    background-position: center;
    transition: background 0.5s ease-in-out;
}

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }
        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #0072ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005bb5;
        }
        .hidden {
            display: none;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        img {
            width: 50px;
            height: 50px;
            margin: 10px 0;
        }
        @media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    h1 {
        font-size: 20px;
    }

    input {
        padding: 10px;
    }

    button {
        font-size: 14px;
        padding: 10px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
        <div id="weatherInfo" class="hidden">
            <h2 id="cityName"></h2>
            <img id="weatherIcon" src="" alt="">
            <p id="temperature"></p>
            <button onclick="toggleTemperature()">Toggle °C / °F</button>
            <p id="humidity"></p>
            <p id="windSpeed"></p>
            <p id="weatherDescription"></p>
        </div>
        <p id="errorMessage" class="error hidden"></p>
    </div>

    <script>
        const apiKey = "ded0c2725b749cb5e8ff9b2e7a8c3e93"; // Replace with your OpenWeatherMap API Key
        let currentTempCelsius = null;
        let isCelsius = true;

        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showError("Please enter a city name.");
                return;
            }

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
                const data = await response.json();

                if (response.ok) {
                    displayWeather(data);
                } else {
                    showError("City not found. Try another.");
                }
            } catch (error) {
                showError("An error occurred. Please try again.");
            }
        }

        function displayWeather(data) {
            const cityName = data.name;
            currentTempCelsius = data.main.temp;
            const humidity = data.main.humidity;
            const windSpeed = data.wind.speed;
            const description = data.weather[0].description;
            const icon = `http://openweathermap.org/img/wn/${data.weather[0].icon}.png`;

            document.getElementById("cityName").textContent = cityName;
            document.getElementById("temperature").textContent = `Temperature: ${currentTempCelsius}°C`;
            document.getElementById("humidity").textContent = `Humidity: ${humidity}%`;
            document.getElementById("windSpeed").textContent = `Wind Speed: ${windSpeed} m/s`;
            document.getElementById("weatherDescription").textContent = description;
            document.getElementById("weatherIcon").src = icon;
            document.getElementById("weatherInfo").classList.remove("hidden");
            document.getElementById("errorMessage").classList.add("hidden");

            isCelsius = true;
            setBackgroundImage(description);
        }

        function toggleTemperature() {
            if (currentTempCelsius === null) return;

            let temp = isCelsius 
                ? (currentTempCelsius * 9/5) + 32 
                : currentTempCelsius;

            document.getElementById("temperature").textContent = `Temperature: ${temp.toFixed(1)}°${isCelsius ? "F" : "C"}`;
            isCelsius = !isCelsius;
        }

        function setBackgroundImage(description) {
            let backgroundImageUrl;

            if (description.includes("clear")) {
                backgroundImageUrl = "url('clear.jpeg')";
            } else if (description.includes("cloud")) {
                backgroundImageUrl = "url('cloudy.jpeg')";
            } else if (description.includes("rain")) {
                backgroundImageUrl = "url('rain.jpeg')";
            } else if (description.includes("snow")) {
                backgroundImageUrl = "url('snow.jpeg')";
            } else if (description.includes("thunderstorm")) {
                backgroundImageUrl = "url('thunder.jpeg')";
            } else {
                backgroundImageUrl = "url('mix.jpeg')";
            }

            document.body.style.backgroundImage = backgroundImageUrl;
        }

        function showError(message) {
            document.getElementById("errorMessage").textContent = message;
            document.getElementById("errorMessage").classList.remove("hidden");
            document.getElementById("weatherInfo").classList.add("hidden");
        }
    </script>
</body>
</html>
